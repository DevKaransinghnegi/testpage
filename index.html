<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuizAI Simple Test</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    form { background: #1e293b; padding: 30px; border-radius: 12px; width: 320px; display: flex; flex-direction: column; gap: 15px; }
    input { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    button { padding: 12px; border-radius: 6px; border: none; background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #status { font-size: 14px; color: #34d399; text-align: center; }
  </style>
</head>
<body>

  <form id="testForm">
    <h2 style="margin: 0;">Test Sign Up</h2>
    <input type="text" id="fullName" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <button type="submit">Create Account</button>
    <div id="status"></div>
  </form>

  <script>
    document.getElementById("testForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const fullName = document.getElementById("fullName").value;
      const email = document.getElementById("email").value;
      const status = document.getElementById("status");

      // PASTE YOUR PRODUCTION WEBHOOK URL HERE:
    const webhookUrl = "https://private8888.app.n8n.cloud/webhook/quizai-signup";

      status.innerText = "Sending...";

      try {
        const res = await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fullName, email })
        });

        if (res.ok) {
          status.innerText = "Success! Check Google Sheets & Gmail.";
        } else {
          status.innerText = "Error: n8n returned status " + res.status;
        }
      } catch (err) {
        status.innerText = "Failed to connect to n8n.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
